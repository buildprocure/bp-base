name: Build PHP Base Image

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: php-base
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # --- Checkout repo ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Debug files (optional) ---
      - name: List files
        run: ls -la

      # --- Login to GHCR ---
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # --- Build image ---
      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile.base \
            -t ghcr.io/${{ github.repository_owner }}/php-base:latest \
            -t ghcr.io/${{ github.repository_owner }}/php-base:${{ github.sha }} \
            .

      # --- Push image ---
      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/php-base:latest
          docker push ghcr.io/${{ github.repository_owner }}/php-base:${{ github.sha }}